[package]
name = "nemora-desktop"
description = "Nemora - music player by nikenmar (CMR)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[lib]
name = "nemora_desktop"
# The unit tests run from the test target below instead (PLAN/21 P21.2): a test target can be given
# the Common Controls v6 manifest (build.rs), which the IPC types test needs to start on Windows.
test = false

[[test]]
name = "desktop"
path = "src/lib.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
nemora-core.workspace = true
log = "0.4"
nemora-audio.workspace = true
serde.workspace = true
serde_json.workspace = true
regex.workspace = true
image.workspace = true
tauri = { version = "2", features = ["tray-icon", "image-ico", "devtools"] }
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
tauri-plugin-process = "2"
tauri-plugin-log = "2"
tauri-plugin-single-instance = "2"
# The view's network calls (lyrics, Last.fm, artist info) still run in the webview until they move
# into the core; Rust fetching keeps them clear of browser CORS.
tauri-plugin-http = "2"
tauri-plugin-updater = "2"
tauri-plugin-autostart = "2"
percent-encoding = "2"
# scrypt key derivation with the parameters 1.x used for stored credentials (secrets.rs).
scrypt = { version = "0.11", default-features = false }
# The OBS now-playing widget on 127.0.0.1 (widget_server.rs).
tiny_http = "0.12"
# Native drag-out of a song file (dragout.rs): an OLE drag carrying CF_HDROP.
drag = "2.1.1"
notify = "8.2.0"
# The agents' door (agent.rs, PLAN/22): a named pipe on the runtime Tauri already runs.
tokio = { version = "1.53", features = ["net", "io-util", "sync", "time", "macros"] }

[target.'cfg(windows)'.dependencies]
# Must track the windows version tao and tauri-runtime-wry use, or HWND types differ.
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_UI_Shell",
  "Win32_UI_Shell_Common",
  "Win32_UI_WindowsAndMessaging",
  "Win32_System_Com",
  "Win32_Graphics_Gdi",
  "Win32_Storage_FileSystem",
  "Win32_System_Power",
  "Win32_Media_Audio",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_WinRT",
  "Media",
  "Storage_Streams",
  "Foundation",
] }
# Discord Rich Presence speaks over a named pipe.
discord-rich-presence = "0.2"

[dev-dependencies]
# PLAN/21 P21.2: the IPC types are read from the commands in a test (src/ipc_types.rs) and written to
# the view; nothing of this reaches a release build.
nemora-core = { workspace = true, features = ["specta"] }
nemora-audio = { workspace = true, features = ["specta"] }
tauri = { version = "2", features = ["specta"] }
specta = { version = "=2.0.0-rc.27", features = ["derive", "function", "serde_json"] }
specta-serde = "=0.0.14"
specta-typescript = "=0.0.14"
specta-util = "=0.0.14"

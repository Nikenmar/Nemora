[package]
name = "nemora-audio"
description = "Nemora's desktop playback engine: decode, DSP, WASAPI shared output"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
cpal = "0.18.2"
rubato = "5.0.1"
realfft = "3.5.0"
symphonia = { workspace = true, features = ["opt-simd", "flac", "mp1", "mp2", "mp3", "aac", "alac", "isomp4", "ogg", "vorbis", "wav", "aiff", "pcm", "mkv"] }
serde.workspace = true
thiserror.workspace = true
# PLAN/21 P21.2: the IPC types are read from Rust by the desktop's tests only; release builds never
# enable this.
specta = { version = "=2.0.0-rc.27", features = ["derive"], optional = true }

[features]
specta = ["dep:specta"]

[build-dependencies]
cc = "1.2"

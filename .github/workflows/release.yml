name: Release

# Tag-driven, not branch-driven: a release is a deliberate act, and pushing to a branch is not.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# Windows only: the player renders through WASAPI shared and integrates with the taskbar, the
# volume mixer and file associations; there is no macOS or Linux build to publish.
# Bash, which stops at the first failing command. The Windows default, PowerShell, runs on past a
# failing program and fails a step only on its last one: 2.0.0's release went on past a failed test.
defaults:
  run:
    shell: bash

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write

    env:
      # Build-time values baked into the view bundle (apps/desktop/.env.example lists them). A
      # missing one disables its feature rather than failing the build.
      MAIN_VITE_DISCORD_CLIENT_ID: ${{ secrets.DISCORD_CLIENT_ID }}
      MAIN_VITE_LAST_FM_API_KEY: ${{ secrets.LAST_FM_API_KEY }}
      # Encrypts stored credentials. The same secret as every 1.x release: CHANGING IT MAKES THE
      # LOGINS 1.x SAVED UNREADABLE.
      MAIN_VITE_ENCRYPTION_SECRET: ${{ secrets.ENCRYPTION_SECRET }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2

      - name: Install dependencies
        working-directory: apps/desktop
        run: npm ci

      - name: Check and test
        run: |
          cargo test --workspace --locked
          npx --prefix apps/desktop tsc --noEmit -p apps/desktop

      # The release's text is "## Nemora 3.0.0-stable", as every release before it, then this version's
      # section of CHANGELOG.md (v3.0.0-stable -> "## 3.0.0", a hotfix v3.0.0-stable.hotfix1 ->
      # "## 3.0.0 hotfix1"). It also goes into latest.json, where Nemora's update card shows its first
      # lines (headings left out). The picture comes later.
      - name: Release notes from CHANGELOG.md
        id: notes
        shell: bash
        run: |
          full="${GITHUB_REF_NAME#v}"
          version="${full%-stable}"
          version="${version/-stable./ }"
          section="$(awk -v head="## $version · " 'index($0, head) == 1 { on = 1; next } on && /^## / { exit } on { print }' CHANGELOG.md)"
          if [ -n "${section//[[:space:]]/}" ]; then
            {
              echo 'body<<NEMORA_NOTES_END'
              printf '## Nemora %s\n%s\n' "$full" "$section"
              echo 'NEMORA_NOTES_END'
            } >> "$GITHUB_OUTPUT"
          fi

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs the update. Without these the build still succeeds and produces NO .sig, and
          # clients reject the update. It must be the key 1.x shipped with (id 1B02376F048B2979),
          # or no installed 1.x accepts 2.0. Check the release assets for a .sig by eye.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          # Ships nemora-mcp.exe beside nemora.exe (PLAN/22): builds and stages it, then bundles it.
          args: --config src-tauri/tauri.mcp.json
          tagName: ${{ github.ref_name }}
          releaseName: 'Nemora __VERSION__'
          releaseBody: ${{ steps.notes.outputs.body || 'See the assets below to download and install.' }}
          # Published by hand after the assets are checked: a draft cannot become the "latest" the
          # updater points at by accident.
          releaseDraft: true
          prerelease: false
          # latest.json, from the signatures: what the updater endpoint in tauri.conf.json fetches.
          includeUpdaterJson: true

      # The same installer once more under a name without the version, so the README's download
      # button can point at releases/latest/download/Nemora_x64-setup.exe and always get the newest.
      # The updater keeps using the versioned file and its .sig.
      - name: Installer without the version in its name
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          exe="target/release/bundle/nsis/Nemora_${GITHUB_REF_NAME#v}_x64-setup.exe"
          test -f "$exe" || { echo "no $exe"; exit 1; }
          cp "$exe" Nemora_x64-setup.exe
          gh release upload "$GITHUB_REF_NAME" Nemora_x64-setup.exe --clobber

      # The README's hero under the release's heading, as it was at this tag (an older release keeps
      # its own picture). Added after the build, so latest.json's notes stay text: the update card
      # in 3.0 shows every line that is not a heading.
      - name: Picture in the release text
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          body="$(gh release view "$GITHUB_REF_NAME" --json body --jq .body)"
          case "$body" in "## "*) ;; *) echo "no heading, left as it is"; exit 0 ;; esac
          {
            printf '%s\n\n' "${body%%$'\n'*}"
            printf '<img src="https://raw.githubusercontent.com/%s/%s/resources/readme/hero.webp" alt="Nemora" width="100%%">\n' "$GITHUB_REPOSITORY" "$GITHUB_REF_NAME"
            printf '%s\n' "${body#*$'\n'}"
          } > release-notes.md
          gh release edit "$GITHUB_REF_NAME" --notes-file release-notes.md

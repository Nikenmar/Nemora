name: CI

# Branches only: a release tag runs its own check and test in release.yml. Nothing runs for a change
# that no check reads (the README and CHANGELOG, pictures, docs, the README's tools, the other
# workflows); crates/*/spec/*.md stays in, the schema tests read it.
on:
  push:
    branches: ['**']
    paths-ignore:
      - '*.md'
      - 'docs/**'
      - 'resources/**'
      - 'tools/readme/**'
      - 'tools/redesign/**'
      - 'tools/bench/**'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/workflows/release.yml'
      - '.github/workflows/codeql.yml'
  pull_request:
    paths-ignore:
      - '*.md'
      - 'docs/**'
      - 'resources/**'
      - 'tools/readme/**'
      - 'tools/redesign/**'
      - 'tools/bench/**'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/workflows/release.yml'
      - '.github/workflows/codeql.yml'
  workflow_dispatch:

# A newer push to the same branch cancels the run still going for the older one.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Bash, which stops at the first failing command. The Windows default, PowerShell, runs on past a
# failing program and fails a step only on its last one: a broken fmt or clippy passed unseen.
defaults:
  run:
    shell: bash

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: swatinem/rust-cache@v2

      # Tests that need ffmpeg or the private fixtures say SKIPPED and pass without them.
      - name: Rust
        run: |
          cargo fmt --all --check
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo test --workspace --locked

      - name: View
        working-directory: apps/desktop
        run: |
          npm ci
          npx tsc --noEmit -p .

      # After both: it reads the crates cargo fetched and the packages npm installed.
      - name: Licences list up to date
        run: node tools/licenses/licenses.mjs --check
